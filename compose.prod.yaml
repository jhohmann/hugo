# Standalone stack for the future Proxmox Docker host.
# Never combine with compose.yaml (that file is only the local development DB).
x-database-env: &database-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-hugo}
  DB_USER: ${DB_USER:-hugo}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}

x-app-env: &app-env
  <<: *database-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY fehlt}
  HUGO_WEB_SEARCH_ENABLED: ${HUGO_WEB_SEARCH_ENABLED:-true}
  HUGO_WEB_SEARCH_MAX_CALLS: ${HUGO_WEB_SEARCH_MAX_CALLS:-3}
  HUGO_CHAT_HISTORY_TOKENS: ${HUGO_CHAT_HISTORY_TOKENS:-12000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8000/ui/kalender/auth/callback}

x-caddy-env: &caddy-env
  HUGO_DOMAIN: ${HUGO_DOMAIN:?HUGO_DOMAIN fehlt}
  # HUGO_TLS_INTERNAL=true stellt ein Zertifikat der Caddy-internen CA aus
  # (nur lokale Namen). Leer lassen für automatische Let's-Encrypt-Zertifikate.
  HUGO_TLS_DIRECTIVE: ${HUGO_TLS_INTERNAL:+tls internal}

x-app: &app
  image: ${HUGO_IMAGE:-hugo:local}
  build: .

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hugo}
      POSTGRES_USER: ${DB_USER:-hugo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
    volumes:
      - hugo_postgres_data:/var/lib/postgresql/data
    networks: [hugo_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "app.migrate"]
    environment: *database-env
    networks: [hugo_internal]
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *app-env
      HUGO_PASSWORD_HASH: ${HUGO_PASSWORD_HASH:?HUGO_PASSWORD_HASH fehlt}
      HUGO_COOKIE_SECURE: ${HUGO_COOKIE_SECURE:-true}
      # Caddy läuft im selben Compose-Netz; dessen Subnetz muss vertraut sein.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    ports:
      - "${WEB_PORT:-127.0.0.1:8000}:8000"
    volumes:
      - model_cache:/home/hugo/.cache/huggingface
    networks: [hugo_internal, hugo_external]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      SCHEDULER_HOUR: ${SCHEDULER_HOUR:-6}
      SCHEDULER_MINUTE: ${SCHEDULER_MINUTE:-0}
    volumes:
      - model_cache:/home/hugo/.cache/huggingface
    # OpenAI, Google and initial embedding downloads need outbound Internet.
    networks: [hugo_internal, hugo_external]
    depends_on:
      migrate: {condition: service_completed_successfully}
    logging:
      driver: json-file
      options: {max-size: "30m", max-file: "3"}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: *caddy-env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [hugo_internal, hugo_external]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  hugo_internal:
    internal: true
  hugo_external: {}

volumes:
  hugo_postgres_data: {}
  model_cache: {}
  caddy_data: {}
  caddy_config: {}
