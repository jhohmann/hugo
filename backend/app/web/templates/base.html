<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>{% block title %}Hugo{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=20261111-settings-2">
  {% if nav_active == 'settings' %}<link rel="stylesheet" href="/static/settings.css?v=20261111-2">{% endif %}
  <link rel="icon"
      type="image/png"
      href="/static/assets/hugo-icon_sm.png">
  <script src="/static/app.js?v=20261111" defer></script>
</head>
<body{% if nav_active == "chat" %} class="chat-page"{% endif %}>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/ui/heute">
        <picture>
          <source
            srcset="/static/assets/hugo-logo-dark_sm.png"
            media="(prefers-color-scheme: dark)"
          >
          <img
              src="/static/assets/hugo-logo-light_sm.png"
              alt="Hugo"
              class="brand-logo"
          >
        </picture>
        </a>
      {% if not login_page %}
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="/ui/chat"{% if nav_active == "chat" %} class="active" aria-current="page"{% endif %}>Chat</a>
        <a href="/ui/heute"{% if nav_active == "heute" %} class="active" aria-current="page"{% endif %}>
          Heute{% if nav_open_suggestions %}<span class="badge" title="Offene Vorschläge">{{ nav_open_suggestions }}</span>{% endif %}
        </a>
        <a href="/ui/threads"{% if nav_active == "threads" %} class="active" aria-current="page"{% endif %}>Vorhaben</a>
        <a href="/ui/kalender"{% if nav_active == "kalender" %} class="active" aria-current="page"{% endif %}>
          Kalender{% if nav_pending_calendar_actions %}<span class="badge" title="Ausstehende Kalenderaktionen">{{ nav_pending_calendar_actions }}</span>{% endif %}
        </a>
      </nav>
      <div class="header-actions">
      <a href="/ui/settings" class="settings-link{% if nav_active == 'settings' %} active{% endif %}" aria-label="Einstellungen" title="Einstellungen"{% if nav_active == 'settings' %} aria-current="page"{% endif %}>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--surface)"/><circle cx="15" cy="17" r="3" fill="var(--surface)"/></svg>
      </a>
      <form method="post" action="/ui/logout" class="logout-form">
        <button type="submit" class="button button-small">Abmelden</button>
      </form>
      </div>
      {% endif %}
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
