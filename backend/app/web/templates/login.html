{% extends "base.html" %}
{% block title %}Anmelden – Hugo{% endblock %}
{% block content %}
<section class="login-card">
  <h1>Bei Hugo anmelden</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login" class="login-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Passwort</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus>
    <label class="remember-label"><input name="remember" type="checkbox" value="true"> Angemeldet bleiben (30 Tage)</label>
    <button type="submit" class="button button-primary">Anmelden</button>
  </form>
</section>
{% endblock %}
