
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hugo
      POSTGRES_USER: hugo
      POSTGRES_PASSWORD: hugo_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hugo -d hugo"]
      interval: 5s
      retries: 5

volumes:
  postgres_data:
